<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Recetas guardadas</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="../styles.css" />

  <!-- CSS propio -->
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

  <!-- HEADER -->
  <div id="header"></div>

  <section class="saved-recipes-section">

    <div class="container">

      <div class="saved-header">
        <span class="section-label">RECETAS GUARDADAS</span>

        <h2>Tus recetas favoritas</h2>

        <p>
          Guarda tus recetas preferidas y accede rápidamente a ellas cuando
          quieras planificar tu menú semanal.
        </p>
      </div>

      <!-- Grid recetas -->
      <div class="saved-grid">

        <!-- CARD -->
        <article class="saved-card">

          <div id="savedRecipesMessage" class="recipes-message"></div>
<div id="savedRecipesContainer" class="recipes-grid"></div>
          </div>
        </article>

      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <div id="footer"></div>

  <!-- CARGAR HEADER Y FOOTER -->
  <script>
    async function loadComponent(id, file) {
      const el = document.getElementById(id);

      if (!el) return;

      const res = await fetch(file);
      const html = await res.text();

      el.innerHTML = html;
    }

    loadComponent("header", "../header.html");
    loadComponent("footer", "../footer.html");
  </script>

</body>
</html>
