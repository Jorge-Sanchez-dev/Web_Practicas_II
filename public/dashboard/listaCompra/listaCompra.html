<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de la compra</title>

    <!-- CSS global dashboard -->
    <link rel="stylesheet" href="../styles.css" />

    <!-- CSS propio -->
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <section class="shopping-list-section">
      <div class="container">
        <div class="shopping-header">
          <span class="section-label">LISTA DE LA COMPRA</span>

          <h2>Tu compra semanal</h2>

          <p>
            Aquí puedes ver todos los ingredientes que necesitas para tus
            recetas y marcar los que ya has comprado.
          </p>
        </div>

        <div class="shopping-topbar">
          <div class="shopping-search">
            <input
              type="text"
              placeholder="Buscar ingrediente..."
              id="searchIngredient"
            />
          </div>

          <div class="shopping-actions">
            <button class="btn btn-outline">Vaciar lista</button>
            <button class="btn btn-primary">Añadir producto</button>
          </div>
        </div>

        <div class="shopping-list-card">
          <div class="shopping-list-head">
            <span>Producto</span>
            <span>Cantidad</span>
            <span>Estado</span>
          </div>

          <div id="shoppingListContainer"></div>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- CARGAR HEADER Y FOOTER -->
    <script>
      fetch("../header.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;
        });

      fetch("../footer.html")
        .then((res) => res.text())
        .then((data) => {
          document.getElementById("footer").innerHTML = data;
        });
    </script>

    <!-- JS PROPIO -->
    <script src="./script.js"></script>
  </body>
</html>
